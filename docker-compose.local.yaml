services:
  bridge:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BRIDGE_CONFIG: /app/config/bridge-docker.yaml
      BRIDGE_CN: bridge.local
      BRIDGE_SANS: bridge.local,localhost,127.0.0.1
      BRIDGE_CLIENT_CN: dev-client
    ports:
      - "9445:9445"
    volumes:
      - ./certs:/app/certs
      - ./config/bridge-docker.yaml:/app/config/bridge-docker.yaml:ro
      - ${HOME}/repos:/repos
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9445'"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 30s
    networks:
      default:
        aliases:
          - bridge.local

  web:
    build:
      context: .
      dockerfile: examples/web/Dockerfile
      target: server-dev
    environment:
      NODE_ENV: development
      BRIDGE_ADDR: bridge.local:9445
      BRIDGE_SERVER_NAME: bridge.local
      VITE_URL: http://vite:5173
      CA_CERT: /certs/ca-bundle.crt
      CLIENT_CERT: /certs/dev-client.crt
      CLIENT_KEY: /certs/dev-client.key
      JWT_KEY: /certs/jwt-signing.key
      JWT_ISSUER: dev
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./certs/ca-bundle.crt:/certs/ca-bundle.crt:ro
      - ./certs/dev-client.crt:/certs/dev-client.crt:ro
      - ./certs/dev-client.key:/certs/dev-client.key:ro
      - ./certs/jwt-signing.key:/certs/jwt-signing.key:ro
    depends_on:
      bridge:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: examples/web/server
          target: /app/examples/web/server
        - action: rebuild
          path: examples/web/Dockerfile

  vite:
    build:
      context: .
      dockerfile: examples/web/Dockerfile
      target: vite-dev
    environment:
      VITE_SERVER_TARGET: http://web:3000
    ports:
      - "5173:5173"
    depends_on:
      - web
    develop:
      watch:
        - action: sync+restart
          path: examples/web/ui/src
          target: /app/examples/web/ui/src
        - action: rebuild
          path: examples/web/ui/package.json
