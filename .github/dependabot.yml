version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      ai-agent-clis:
        patterns:
          - "@anthropic-ai/*"
          - "@google/*"
          - "@openai/*"
          - "opencode-ai"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
