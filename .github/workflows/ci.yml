name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"

      - name: Install Go tooling
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run lint
        run: make lint

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: ./scripts/test-go-coverage.sh

      - name: Enforce maintained package coverage
        run: make test-cover-maintained

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: markcallen/ai-agent-bridge
          files: ./coverage.out
          flags: go
          name: go-coverage

  typescript-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install root dependencies
        run: npm ci

      - name: Install web UI dependencies
        run: pnpm --dir examples/web/ui install --frozen-lockfile

      - name: Lint TypeScript
        run: npm run lint:ts

  typescript-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install root dependencies
        run: npm ci

      - name: Install web UI dependencies
        run: pnpm --dir examples/web/ui install --frozen-lockfile

      - name: Build web UI
        run: pnpm --dir examples/web/ui run build

  smoke:
    if: github.event_name == 'pull_request'
    needs:
      - go-lint
      - go-test
      - typescript-lint
      - typescript-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run smoke test
        run: ./scripts/smoke.sh

  apt-smoke-local:
    if: github.event_name == 'pull_request'
    needs:
      - go-lint
      - go-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Run local apt smoke test
        run: ./scripts/smoke-apt-local.sh
