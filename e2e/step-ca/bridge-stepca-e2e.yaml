server:
  listen: "0.0.0.0:9445"

sessions:
  max_per_project: 5
  max_global: 20
  idle_timeout: "30m"
  stop_grace_period: "10s"
  event_buffer_size: 8388608

input:
  max_size_bytes: 65536

rate_limits:
  global_rps: 50
  global_burst: 100
  start_session_per_client_rps: 10
  start_session_per_client_burst: 20
  send_input_per_session_rps: 20
  send_input_per_session_burst: 50

# Echo provider is always registered by localserver; no providers section needed.

allowed_paths:
  - "/tmp"

logging:
  level: "info"
  format: "json"
  redact_patterns:
    - "(?i)(api[_-]?key|token|secret|password)\\s*[:=]\\s*\\S+"
